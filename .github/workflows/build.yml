name: Unzip and Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip project
      run: |
        unzip -o *.zip
        # Zipten çıkan klasörün adını bulup içindeki her şeyi ana dizine taşıyalım
        DIR_NAME=$(ls -d */ | grep -v '^\.' | head -n 1)
        if [ -n "$DIR_NAME" ]; then
          echo "Klasör bulundu: $DIR_NAME"
          cp -r "$DIR_NAME"* . || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Project
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew build --no-daemon
        else
          gradle build --no-daemon
        fi

    - name: Upload Built Jar Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Built-Minecraft-Mods
        path: |
          **/build/libs/*.jar
