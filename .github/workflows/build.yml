name: Unzip and Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip project
      run: |
        unzip -o *.zip
        # Zip içeriği bir alt klasöre çıktıysa kök dizine taşıyalım
        if [ -d "DimensionWarriors_MultiLoader_Forge_Fabric_1.20.1-26.2" ]; then
          cp -r DimensionWarriors_MultiLoader_Forge_Fabric_1.20.1-26.2/* .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.5

    - name: Make gradlew executable
      run: chmod +x gradlew || true

    - name: Build with Gradle
      run: gradle build

    - name: Upload Built Jar Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: Built-Minecraft-Mods
        path: |
          build/libs/*.jar
          */build/libs/*.jar

