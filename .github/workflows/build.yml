name: Unzip and Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip project
      run: |
        unzip -o *.zip
        # Eğer zipten çıkan klasör oluştuysa içeriği ana dizine taşı
        if [ -d "DimensionWarriors_MultiLoader_Forge_Fabric_1.20.1-26.2" ]; then
          cp -r DimensionWarriors_MultiLoader_Forge_Fabric_1.20.1-26.2/* . || true
        fi
        if [ -d "DimensionWarriors" ]; then
          cp -r DimensionWarriors/* . || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle Wrapper
      run: ./gradlew build --no-daemon

    - name: Upload Built Jar Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Built-Minecraft-Mods
        path: |
          build/libs/*.jar
          */build/libs/*.jar
